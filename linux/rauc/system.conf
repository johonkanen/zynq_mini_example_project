# RAUC system configuration for the Zynq Mini (doc/network_update.md).
#
# Phase 1: one read-only rootfs slot (bootloader=noop) and the "pl" artifact
# repository, which holds FPGA designs (PL bundles from linux/make-pl-bundle.sh).
# Bundles must be signed by a certificate that chains to keyring.pem.

[system]
compatible=zynq-mini
bootloader=noop
# RAUC's own state (slot status, install history); phase 3 puts /data on its own partition
data-directory=/data/rauc

[keyring]
path=/etc/rauc/keyring.pem
# the signer certificate must carry extendedKeyUsage=codeSigning
check-purpose=codesign
# no RTC or NTP: the clock starts at 1970 on every boot, so check the certificates
# against the time the bundle was signed instead of "now"
use-bundle-signing-time=true

[handlers]
post-install=/usr/lib/rauc/post-install.sh

# The running root filesystem. RAUC must recognise the booted slot (it matches
# root= on the kernel command line) before it installs anything, even artifacts.
# readonly: nothing is ever written to it - phase 3 adds rootfs.0/rootfs.1 A/B.
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
readonly=true

[artifacts.pl]
description=FPGA designs: bitstream + device-tree overlay + manifest
path=/data/rauc/pl
type=trees
